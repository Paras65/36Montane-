<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2319" />
      <stop offset="50%" stop-color="#11261D" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D58C" />
      <stop offset="50%" stop-color="#E9C46A" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E26548" />
      <stop offset="100%" stop-color="#C84B31" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Tribal Geometric Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#D4A373" stroke-width="2" opacity="0.6" />

  <!-- Glowing Morning Sun -->
  <circle cx="340" cy="170" r="50" fill="url(#goldGrad)" filter="url(#shadow)" />
  <circle cx="340" cy="170" r="62" fill="none" stroke="#E9C46A" stroke-width="2" opacity="0.4" stroke-dasharray="6 4" />

  <!-- Left Mountain Peak (Maikal / Bastar Ridge - Terracotta) -->
  <polygon points="90,390 220,160 350,390" fill="url(#terraGrad)" filter="url(#shadow)" />
  <!-- Snow / Mist Peak on Mountain 1 -->
  <polygon points="220,160 195,205 210,215 220,205 235,218 245,205" fill="#FAF6F0" opacity="0.95" />

  <!-- Right Mountain Ridge (Dense Sal Forest) -->
  <polygon points="230,390 350,200 440,390" fill="#1B4332" opacity="0.95" />
  <polygon points="350,200 330,235 345,245 355,238 370,246" fill="#FAF6F0" opacity="0.85" />

  <!-- Base Earthen Layer / Foothills -->
  <path d="M 60,390 Q 256,365 452,390 L 452,430 Q 256,420 60,430 Z" fill="#0E2419" />

  <!-- Adventure Expedition Tent (Center) -->
  <polygon points="256,290 190,395 322,395" fill="url(#goldGrad)" filter="url(#shadow)" />
  <polygon points="256,290 256,395 322,395" fill="#C84B31" opacity="0.85" />
  <polygon points="256,325 230,395 282,395" fill="#11261D" />

  <!-- Bastar "36" Brand Monogram at bottom -->
  <text x="256" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="900" fill="#E9C46A" letter-spacing="4">
    36 MONTANE
  </text>
</svg>
